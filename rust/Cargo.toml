[workspace]
members = ["num2words2-core", "words2num2-core", "words2num2-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only"
repository = "https://github.com/jqueguiner/words2num2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
