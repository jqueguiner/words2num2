name: Release

# Builds per-platform wheels with maturin and publishes them:
#   * wheels + sdist -> PyPI (trusted publishing / OIDC)
#   * wheels + sdist -> GitHub Release
# words2num2 is a single-variant package: the compiled core embeds
# num2words2-core natively (no lingua-rs models), so each wheel is ~2-4 MB.
# Triggered by pushing a version tag, e.g. `v0.3.0`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v), e.g. 0.3.0"
        required: true

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  build:
    name: wheel · ${{ matrix.platform.target }}
    needs: version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-14,       target: aarch64-apple-darwin }
          - { os: macos-13,       target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Set version in pyproject
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml"); s = p.read_text()
          s = re.sub(r'(?m)^version = ".*"$',
                     'version = "${{ needs.version.outputs.version }}"', s, count=1)
          p.write_text(s)
          PY

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || '' }}
          args: --release --out dist
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version in pyproject
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml"); s = p.read_text()
          s = re.sub(r'(?m)^version = ".*"$',
                     'version = "${{ needs.version.outputs.version }}"', s, count=1)
          p.write_text(s)
          PY
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish wheels + sdist to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/words2num2/
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # ---------------------------------------------------------------------------
  github-release:
    name: Attach all wheels to the GitHub Release
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            Automated release built by maturin.

            `words2num2` is the Rust-powered inverse of `num2words2`: it parses
            spoken-form numbers back to numeric values across 100+ languages.
            Wheels embed the conversion core natively (~2-4 MB, no external
            model files) and the package has no runtime dependencies.

            ```bash
            pip install words2num2
            ```
